
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7dfe9">
  <title>Pembaca Buku — BacaKita</title>
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/reader.css">
</head>
<body class="reader-page">
  <header class="reader-header">
    <a class="brand" href="./library.html">BacaKita<span>.</span></a>
    <div class="reader-book-title" id="readerTitle">Memuat buku...</div>
    <a class="reader-close" href="./library.html" aria-label="Kembali ke koleksi">✕</a>
  </header>

  <main class="reader-layout">
    <aside class="reader-sidebar" id="readerSidebar">
      <h3>Daftar Isi</h3>
      <nav id="tocList">
        <p>Memuat daftar isi...</p>
      </nav>
    </aside>

    <section class="reader-main">
      <div class="reader-toolbar">
        <button id="tocToggle" type="button">☷ Daftar Isi</button>
        <div class="reader-tools">
          <button id="fontDecrease" type="button" aria-label="Perkecil huruf">A−</button>
          <button id="fontIncrease" type="button" aria-label="Perbesar huruf">A+</button>
          <button id="themeToggle" type="button">Mode Gelap</button>
          <button id="bookmarkButton" type="button">♡ Tandai</button>
        </div>
      </div>

      <div id="readerMessage" class="reader-message" aria-live="polite">
        Menyiapkan buku...
      </div>

      <div id="epubViewer" class="epub-viewer"></div>

      <div class="reader-navigation">
        <button class="button button-light" id="previousPage" type="button">← Sebelumnya</button>
        <span id="readingProgress">0%</span>
        <button class="button button-primary" id="nextPage" type="button">Berikutnya →</button>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>
  <script src="./js/config.js"></script>
  <script src="./js/app.js"></script>
  <script src="./js/reader.js"></script>
</body>
</html>
